stt:
  engine: "openai-whisper"
  cli_path: "whisper"
  model_name: "medium"
  model_dir: "kiosk/models/whisper"
  model_path: ""
  ffmpeg_path: ""
  language: null
  task: "transcribe"
  sample_rate: 16000
  channels: 1
  sample_width: 2
  recordings_dir: "kiosk/data/recordings"
  extra_args: []

rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  index_path: "kiosk/data/index.json"
  top_k: 4

llm:
  model_path: ""
  n_ctx: 4096
  max_tokens: 512
  temperature: 0.2

ollama:
  host: "http://127.0.0.1:11434"
  model: "gemma3:4b"
  max_tokens: 256
  temperature: 0.2
  system: "You are a concise kiosk assistant. If the user speaks Cebuano or mixed Cebuano and English, respond naturally in the same style. Answer only the current user message."

tts:
  # Use Piper on Windows and Raspberry Pi.
  # Leave binary_path empty to auto-detect:
  #   Windows: kiosk/models/piper/bin/piper.exe or piper.exe on PATH
  #   Linux/Raspberry Pi: kiosk/models/piper/bin/piper or piper on PATH
  engine: "piper"
  binary_path: ""
  voice_path: "kiosk/models/piper/voices/en_US-amy-medium.onnx"
  output_file: "kiosk/data/last_response.wav"
  playback_command: "auto"
  extra_args: []

thresholds:
  vad_silence_ms: 800
  min_retrieval_score: 0.2
